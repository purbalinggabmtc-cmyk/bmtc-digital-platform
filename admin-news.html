<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
CMS Berita BMTC
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>


<header class="navbar">


<div class="brand">


<img
src="https://yrvnmmascklkuzpjkwxn.supabase.co/storage/v1/object/public/bmtc%20media/logo/logo-bmtc.png"
class="logo-image"
alt="Logo BMTC"
>


<div class="logo-text">
BMTC
</div>


</div>



<nav>

<a href="admin.html">
Dashboard
</a>


<a href="#" onclick="logout()">
Logout
</a>


</nav>


</header>





<section class="admin-header">


<h1>
Kelola Berita BMTC
</h1>


<p>
Publikasi informasi resmi organisasi
</p>


</section>





<section class="news-admin-container">



<div class="news-form-card">


<h2>
Tambah Berita
</h2>



<label>
Judul Berita
</label>


<input
type="text"
id="title"
placeholder="Contoh: Anniversary BMTC ke-24"
>




<label>
Ringkasan
</label>


<textarea
id="summary"
placeholder="Ringkasan berita"
></textarea>





<label>
Isi Berita
</label>


<textarea
id="content"
placeholder="Isi lengkap berita"
rows="8"
></textarea>





<label>
URL Foto
</label>


<input
type="text"
id="image_url"
placeholder="URL gambar Supabase"
>




<label>
Status
</label>


<select id="status">


<option value="draft">
Draft
</option>


<option value="publish">
Publish
</option>


</select>





<button onclick="saveNews()">

Simpan Berita

</button>



<p id="message"></p>


</div>





<div class="news-preview-card">


<h2>
Preview
</h2>


<div id="preview">


Belum ada data

</div>


</div>



</section>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/auth.js"></script>

<script src="js/news.js"></script>



<script>

checkLogin();

</script>


</body>

</html>
