<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
CMS Berita BMTC
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>



<header class="site-header">


<div class="brand-main">


<img

src="https://yrvnmmascklkuzpjkwxn.supabase.co/storage/v1/object/public/bmtc%20media/logo/logo-bmtc.png"

class="main-logo"

alt="Logo BMTC"

>



<div class="brand-title">


<h1>
BMTC ADMIN
</h1>


<p>
Management Dashboard
</p>


</div>


</div>




<nav class="main-nav">


<a href="admin.html">
Dashboard
</a>


<a href="#" onclick="logout()">
Logout
</a>


</nav>


</header>







<section class="admin-header">


<h1>
Kelola Berita BMTC
</h1>


<p>
Publikasi informasi resmi organisasi
</p>


</section>









<section class="news-admin-container">





<div class="news-form-card">


<h2 id="form-title">
Tambah Berita
</h2>






<label>
Judul Berita
</label>


<input

type="text"

id="title"

>






<label>
Ringkasan
</label>


<textarea

id="summary"

></textarea>






<label>
Isi Berita
</label>


<textarea

id="content"

rows="8"

></textarea>







<label>
Upload Foto Baru
</label>


<input

type="file"

id="image_file"

accept="image/*"

>





<img

id="image-preview"

style="width:220px;margin-top:15px;border-radius:10px;display:none"

>








<label>
Status
</label>


<select id="status">


<option value="draft">
Draft
</option>


<option value="publish">
Publish
</option>


</select>







<button onclick="saveNews()">

Simpan Berita

</button>





<input

type="hidden"

id="news_id"

>




<input

type="hidden"

id="old_image_url"

>




<p id="message"></p>



</div>








<div class="news-preview-card">


<h2>
Preview
</h2>


<div id="preview">

Belum ada data

</div>


</div>





</section>









<section class="news-list-admin">


<h2>
Daftar Berita BMTC
</h2>



<table>


<thead>


<tr>

<th>
Foto
</th>

<th>
Judul
</th>

<th>
Status
</th>

<th>
Tanggal
</th>

<th>
Aksi
</th>

</tr>


</thead>



<tbody id="news-table">


</tbody>



</table>


</section>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/upload.js"></script>

<script src="js/news.js"></script>




<script>

checkLogin();

</script>



</body>

</html>
