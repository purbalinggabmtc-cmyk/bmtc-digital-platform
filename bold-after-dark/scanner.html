<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — HIGH-SPEED CHECK IN</title>

  <!-- =========================================================
       QR SCANNER LIBRARY
       ========================================================= -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>

  <!-- =========================================================
       NAVIGATION CONFIG
       =========================================================

       navigation.js sebaiknya berisi:

       window.BOLD_AFTER_DARK_NAVIGATION = Object.freeze({
         home: "https://bmtc.my.id/bold-after-dark/index.html",
         admin: "https://bmtc.my.id/bold-after-dark/admin.html",
         report: "https://bmtc.my.id/bold-after-dark/report.html",
         scanner: "https://bmtc.my.id/bold-after-dark/scanner.html",
         registration: "https://bmtc.my.id/bold-after-dark/registration/index.html"
       });

       ========================================================= -->

  <script src="/bold-after-dark/config/navigation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/js/admin-auth.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: not-allowed;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* =========================================================
       TOP NAV
       ========================================================= */

    .top-nav {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 11px 16px;

      background: #111111;

      color: #ffffff;

      border: 1px solid #444444;

      border-radius: 8px;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.5px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .home-button:hover {
      background: #1d1d1d;
      border-color: #e00000;
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .brand .bold {
      color: #ffffff;
    }

    .brand .after {
      color: #e00000;
    }

    .brand .dark {
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #aaaaaa;
      margin-bottom: 24px;
    }


    /* =========================================================
       CONNECTION + FEEDBACK CONTROL
       ========================================================= */

    .connection-panel {
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #333333;
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.34);
    }

    .connection-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .connection-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.9px;
    }

    .connection-badge::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }

    .connection-badge.online {
      color: #7dffa9;
      background: rgba(22, 199, 90, 0.14);
      border: 1px solid rgba(22, 199, 90, 0.65);
    }

    .connection-badge.offline {
      color: #ff8b8b;
      background: rgba(224, 0, 0, 0.14);
      border: 1px solid rgba(224, 0, 0, 0.65);
    }

    .audio-button {
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid #555555;
      border-radius: 8px;
      background: #171717;
      color: #dddddd;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.35px;
    }

    .audio-button.active {
      color: #ffffff;
      border-color: #16c75a;
      background: rgba(22, 199, 90, 0.14);
    }

    .audio-button:disabled {
      opacity: 0.55;
    }

    .connection-text {
      margin-top: 7px;
      color: #888888;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.45;
      text-align: left;
    }

    /* =========================================================
       SCANNER CARD
       ========================================================= */

    .scanner-card {
      background: #111111;

      border: 1px solid #333333;

      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 0 30px rgba(255, 0, 0, 0.12);
    }

    #reader {
      width: 100%;

      min-height: 280px;

      overflow: hidden;

      border-radius: 12px;

      background: #050505;

      position: relative;
    }

    #reader video {
      width: 100% !important;

      max-width: 100% !important;

      height: auto !important;

      display: block;

      border-radius: 10px;
    }

    #reader img {
      max-width: 100%;
    }

    #reader__dashboard {
      color: #ffffff;
      background: #111111;
    }

    #reader__dashboard_section {
      padding: 10px !important;
    }

    #reader button {
      background: #e00000 !important;

      color: #ffffff !important;

      border: none !important;

      border-radius: 7px !important;

      padding: 9px 12px !important;

      font-weight: 700 !important;
    }

    #reader select {
      background: #222222 !important;

      color: #ffffff !important;

      border: 1px solid #444444 !important;

      border-radius: 7px !important;

      padding: 8px !important;
    }

    /* =========================================================
       CAMERA PLACEHOLDER
       ========================================================= */

    .camera-placeholder {
      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 20px;

      color: #777777;

      background: #050505;

      text-align: center;

      pointer-events: none;

      z-index: 1;
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .camera-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .camera-placeholder-title {
      color: #aaaaaa;

      font-size: 14px;

      font-weight: 800;

      margin-bottom: 6px;
    }

    .camera-placeholder-text {
      color: #666666;

      font-size: 11px;

      line-height: 1.5;
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status-text {
      margin-top: 12px;

      font-size: 12px;

      color: #888888;

      min-height: 18px;

      line-height: 1.5;
    }

    /* =========================================================
       NAVIGATION ERROR
       ========================================================= */

    .navigation-error {
      display: none;

      margin-top: 12px;

      padding: 10px 12px;

      background: rgba(224, 0, 0, 0.1);

      border:
        1px solid
        rgba(224, 0, 0, 0.4);

      border-radius: 8px;

      color: #ff8b8b;

      font-size: 11px;

      line-height: 1.5;

      text-align: left;
    }

    /* =========================================================
       MANUAL TOKEN
       ========================================================= */

    .manual {
      margin-top: 18px;

      display: flex;

      gap: 8px;
    }

    .manual input {
      flex: 1;

      min-width: 0;
      min-height: 54px;

      padding: 14px;

      background: #1c1c1c;

      color: #ffffff;

      border: 1px solid #444444;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    .manual input::placeholder {
      color: #777777;
    }

    .manual input:focus {
      border-color: #e00000;

      box-shadow:
        0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .manual button {
      min-height: 54px;
      padding: 14px 18px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }

    .manual button:hover {
      background: #ff0000;
    }

    .manual button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    /* =========================================================
       RESULT
       ========================================================= */

    .result {
      margin-top: 18px;

      padding: 20px;

      border-radius: 14px;

      display: none;
    }

    .result.valid {
      display: block;

      background: #062d16;

      border: 2px solid #16c75a;
    }

    .result.used {
      display: block;

      background: #2d2100;

      border: 2px solid #e2b400;
    }

    .result.invalid {
      display: block;

      background: #300000;

      border: 2px solid #e00000;
    }

    .result.error {
      display: block;

      background: #300000;

      border: 2px solid #e00000;
    }

    .result.loading {
      display: block;
      background: #151515;
      border: 2px solid #666666;
    }

    .result-title {
      font-size: 36px;

      font-weight: 900;

      margin-bottom: 14px;
      line-height: 1.05;
      letter-spacing: 0.4px;
      overflow-wrap: anywhere;
    }

    .valid .result-title {
      color: #16c75a;
    }

    .used .result-title {
      color: #e2b400;
    }

    .invalid .result-title {
      color: #ff3333;
    }

    .error .result-title {
      color: #ff4d4d;
    }

    .loading .result-title {
      color: #ffffff;
    }

    .detail {
      margin-top: 10px;

      font-size: 16px;

      color: #dddddd;

      line-height: 1.5;
    }

    .detail strong {
      color: #ffffff;
    }

    .primary-detail {
      font-size: 18px;
      font-weight: 800;
    }


    /* =========================================================
       PURCHASE / ITEM DELIVERY
       ========================================================= */

    .purchase-panel {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.14);
      text-align: left;
    }

    .purchase-heading {
      margin-bottom: 12px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .purchase-product {
      margin-bottom: 4px;
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.25;
    }

    .purchase-qty {
      margin-bottom: 14px;
      color: #ffffff;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
    }

    .purchase-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .purchase-field {
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .purchase-field-label {
      margin-bottom: 4px;
      color: #888888;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .purchase-field-value {
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .payment-badge,
    .delivery-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .payment-approved {
      background: rgba(22, 199, 90, 0.15);
      border: 1px solid #16c75a;
      color: #7dffa9;
    }

    .payment-pending {
      background: rgba(226, 180, 0, 0.14);
      border: 1px solid #e2b400;
      color: #ffe16a;
    }

    .payment-rejected {
      background: rgba(224, 0, 0, 0.14);
      border: 1px solid #e00000;
      color: #ff8b8b;
    }

    .delivery-ready {
      background: rgba(22, 199, 90, 0.15);
      border: 1px solid #16c75a;
      color: #7dffa9;
    }

    .delivery-done {
      background: rgba(226, 180, 0, 0.14);
      border: 1px solid #e2b400;
      color: #ffe16a;
    }

    .delivery-blocked {
      background: rgba(224, 0, 0, 0.14);
      border: 1px solid #e00000;
      color: #ff8b8b;
    }

    .deliver-button {
      width: 100%;
      min-height: 58px;
      margin-top: 14px;
      padding: 16px 14px;
      border: 0;
      border-radius: 10px;
      background: #16c75a;
      color: #03160a;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .deliver-button:hover {
      background: #26e56d;
    }

    .deliver-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .delivery-inline-message {
      display: none;
      margin-top: 10px;
      padding: 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.45;
      text-align: center;
    }

    .delivery-inline-message.error {
      display: block;
      color: #ff9d9d;
      background: rgba(224, 0, 0, 0.13);
      border: 1px solid rgba(224, 0, 0, 0.55);
    }

    .delivery-inline-message.warning {
      display: block;
      color: #ffe16a;
      background: rgba(226, 180, 0, 0.14);
      border: 1px solid rgba(226, 180, 0, 0.55);
    }

    .delivery-inline-message.info {
      display: block;
      color: #d8d8d8;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .delivery-warning {
      margin-top: 12px;
      padding: 12px;
      border-radius: 9px;
      background: rgba(224, 0, 0, 0.13);
      border: 1px solid rgba(224, 0, 0, 0.55);
      color: #ff9d9d;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.5;
      text-align: center;
    }

    .no-purchase {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      border: 1px dashed #555555;
      color: #aaaaaa;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 480px) {
      .purchase-grid {
        grid-template-columns: 1fr;
      }

      .purchase-product {
        font-size: 18px;
      }

      .purchase-qty {
        font-size: 26px;
      }
    }


    .auto-reset-notice {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 9px;
      color: #dddddd;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.55px;
      line-height: 1.4;
    }

    .auto-reset-notice.hold {
      color: #ffe16a;
      background: rgba(226, 180, 0, 0.13);
      border-color: rgba(226, 180, 0, 0.65);
    }

    /* =========================================================
       RESET
       ========================================================= */

    .reset {
      margin-top: 14px;

      width: 100%;
      min-height: 56px;

      padding: 14px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      font-size: 15px;
    }

    .reset:hover {
      background: #ff0000;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 20px;

      font-size: 11px;

      color: #666666;

      letter-spacing: 2px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      body {
        padding: 10px;
        align-items: flex-start;
      }

      .top-nav {
        margin-bottom: 14px;
      }

      .home-button {
        width: 100%;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .scanner-card {
        padding: 10px;

        border-radius: 15px;
      }

      .connection-row {
        align-items: stretch;
      }

      .connection-badge,
      .audio-button {
        flex: 1;
      }

      #reader {
        min-height: 250px;
      }

      .manual {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

      .result {
        padding: 18px 13px;
        scroll-margin-top: 8px;
      }

      .result-title {
        font-size: 30px;
      }

      .detail {
        font-size: 15px;
      }

      .primary-detail {
        font-size: 17px;
      }

      .reset,
      .deliver-button,
      .manual button,
      .manual input {
        min-height: 58px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- =======================================================
         HOME
         ======================================================= -->

    <div class="top-nav">

      <a
        href="#"
        id="homeButton"
        class="home-button"
      >
        ← HOME
      </a>

    </div>

    <!-- =======================================================
         BRAND
         ======================================================= -->

    <div class="brand">
      <span class="bold">BOLD</span>
      <span class="after"> AFTER</span>
      <span class="dark"> DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <!-- =======================================================
         SCANNER
         ======================================================= -->

    <div class="scanner-card">

      <div class="connection-panel">
        <div class="connection-row">
          <div
            id="connectionBadge"
            class="connection-badge offline"
            role="status"
            aria-live="polite"
          >
            <span id="connectionLabel">OFFLINE</span>
          </div>

          <button
            type="button"
            id="audioButton"
            class="audio-button"
          >
            🔊 AKTIFKAN SUARA
          </button>
        </div>

        <div
          id="connectionText"
          class="connection-text"
        >
          Memeriksa koneksi...
        </div>
      </div>

      <div id="reader">

        <div
          id="cameraPlaceholder"
          class="camera-placeholder"
        >

          <div class="camera-icon">
            📷
          </div>

          <div class="camera-placeholder-title">
            MEMULAI KAMERA
          </div>

          <div class="camera-placeholder-text">
            Izinkan akses kamera ketika browser memintanya.
          </div>

        </div>

      </div>

      <div
        id="scannerStatus"
        class="status-text"
      >
        Menyiapkan scanner...
      </div>

      <!-- =====================================================
           NAVIGATION ERROR
           ===================================================== -->

      <div
        id="navigationError"
        class="navigation-error"
      ></div>

      <!-- =====================================================
           MANUAL TOKEN
           ===================================================== -->

      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          type="button"
          id="manualButton"
        >
          CHECK
        </button>

      </div>

      <!-- =====================================================
           RESULT
           ===================================================== -->

      <div
        id="result"
        class="result"
        role="status"
        aria-live="assertive"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div id="resultDetails"></div>

        <div
          id="autoResetNotice"
          class="auto-reset-notice"
          aria-live="polite"
        ></div>

        <button
          type="button"
          id="resetButton"
          class="reset"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>

  <script>

    "use strict";

    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";

    const API_URL =
      SUPABASE_URL +
      "/functions/v1/dynamic-service";


    /* =========================================================
       FALLBACK NAVIGATION
       =========================================================

       Kamera TIDAK bergantung pada navigation.js.

       Jika navigation.js gagal dimuat,
       kamera tetap bisa aktif.

       ========================================================= */

    const FALLBACK_NAVIGATION = Object.freeze({

      home:
        "https://bmtc.my.id/bold-after-dark/index.html",

      admin:
        "https://bmtc.my.id/bold-after-dark/admin.html",

      report:
        "https://bmtc.my.id/bold-after-dark/report.html",

      scanner:
        "https://bmtc.my.id/bold-after-dark/scanner.html",

      registration:
        "https://bmtc.my.id/bold-after-dark/registration/index.html"

    });


    /* =========================================================
       STATE
       ========================================================= */

    let scanner = null;
    let scannerPaused = false;
    let cameraOperation = Promise.resolve();

    let processing = false;
    let requestInFlight = false;
    let requestTimeout = null;
    let requestController = null;
    let requestSequence = 0;

    let autoResetTimeout = null;
    let autoResetTicker = null;
    let autoResetDeadline = 0;
    let autoResetGeneration = 0;

    let navigationConfig = FALLBACK_NAVIGATION;
    let currentAdminAccess = null;
    let currentPurchase = null;

    let deliveryProcessing = false;
    let deliveryRequestController = null;
    let deliveryRequestTimeout = null;

    let resetProcessing = false;

    let audioContext = null;
    let audioEnabled = false;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const homeButton =
      document.getElementById("homeButton");

    const reader =
      document.getElementById("reader");

    const scannerStatus =
      document.getElementById("scannerStatus");

    const navigationError =
      document.getElementById("navigationError");

    const manualToken =
      document.getElementById("manualToken");

    const manualButton =
      document.getElementById("manualButton");

    const result =
      document.getElementById("result");

    const resultTitle =

    async function handleOffline() {
      updateConnectionStatus();
      cancelAutoReset();

      if (requestController) {
        try {
          requestController.abort();
        } catch {
          // No action required.
        }
      }

      if (deliveryRequestController) {
        try {
          deliveryRequestController.abort();
        } catch {
          // No action required.
        }
      }

      if (deliveryProcessing) {
        setScannerStatus(
          "Koneksi terputus. Penyerahan belum dapat disimpan."
        );

        return;
      }

      if (requestInFlight) {
        return;
      }

      if (hasPendingApprovedDelivery()) {
        setScannerStatus(
          "OFFLINE. Barang belum boleh dikonfirmasi sampai koneksi kembali."
        );

        showHoldNotice(
          "OFFLINE • MENUNGGU KONEKSI UNTUK PENYERAHAN"
        );

        return;
      }

      processing = true;
      updateControlState();

      await suspendScannerForResult();
      showOfflineError();
    }


    async function handleOnline() {
      updateConnectionStatus();

      if (
        deliveryProcessing ||
        requestInFlight ||
        resetProcessing
      ) {
        return;

      if (hasPendingApprovedDelivery()) {
        setScannerStatus(
          "Online kembali. Selesaikan penyerahan barang."
        );

        showHoldNotice(
          "TINDAKAN DIPERLUKAN • SERAHKAN BARANG"

        updateControlState();
        return;

      await resetScanner({
        automatic: true,
        source: "connection-online"

    async function unlockAudio(
      playConfirmation = false
    ) {
      const AudioContextClass =
        getAudioContextClass();

      if (!AudioContextClass) {
        updateAudioButton();
        return false;
      }

      try {
        if (!audioContext) {
          audioContext =
            new AudioContextClass();
        }

        if (
          audioContext.state ===
          "suspended"
        ) {
          await audioContext.resume();
        }

        audioEnabled =
          audioContext.state ===
          "running";

        updateAudioButton();

        if (
          playConfirmation &&
          audioEnabled
        ) {
          playTonePattern([
            {
              frequency: 820,
              duration: 0.08,
              gap: 0,
              type: "sine",
              gain: 0.1
            }
          ]);
        }

        return audioEnabled;

      } catch (error) {
        console.warn(
          "AUDIO UNLOCK ERROR:",
          error
        );

        audioEnabled = false;
        updateAudioButton();
        return false;
      }
    }


    function playTonePattern(pattern) {
      if (
        !audioContext ||
        audioContext.state !== "running" ||
        !Array.isArray(pattern)
      ) {
        return;
      }

      let cursor =
        audioContext.currentTime + 0.015;

      for (const step of pattern) {
        const oscillator =
          audioContext.createOscillator();

        const gainNode =
          audioContext.createGain();

        const duration =
          Math.max(
            Number(step.duration || 0.08),
            0.03
          );

        const peakGain =
          Math.max(
            Number(step.gain || 0.12),
            0.01
          );

        oscillator.type =
          step.type || "sine";

        oscillator.frequency.setValueAtTime(
          Number(step.frequency || 440),
          cursor
        );

        gainNode.gain.setValueAtTime(
          0.0001,
          cursor
        );

        gainNode.gain.exponentialRampToValueAtTime(
          peakGain,
          cursor + 0.012
        );

        gainNode.gain.exponentialRampToValueAtTime(
          0.0001,
          cursor + duration
        );

        oscillator.connect(
          gainNode
        );

        gainNode.connect(
          audioContext.destination
        );

        oscillator.start(cursor);
        oscillator.stop(
          cursor + duration + 0.02
        );

        cursor +=
          duration +
          Number(step.gap || 0);
      }
    }


    function triggerFeedback(type) {
      const normalized =
        String(type || "")
          .toUpperCase();

      const sound =
        FEEDBACK_SOUNDS[normalized];

      if (sound) {
        playTonePattern(sound);
      }

      const vibration =
        FEEDBACK_VIBRATIONS[normalized];

      if (
        vibration &&
        typeof navigator.vibrate ===
          "function"
      ) {
        try {
          navigator.vibrate(
            vibration
          );
        } catch (error) {
          console.warn(
            "VIBRATION ERROR:",
            error
          );
        }
      }
    }


    /* =========================================================
       AUTO RESET
       ========================================================= */

    function clearAutoResetNotice() {
      autoResetNotice.textContent = "";
      autoResetNotice.style.display =
        "none";

      autoResetNotice.className =
        "auto-reset-notice";
    }


    function showHoldNotice(text) {
      autoResetNotice.textContent =
        text || "";

      autoResetNotice.className =
        "auto-reset-notice hold";

      autoResetNotice.style.display =
        "block";
    }


    function cancelAutoReset() {
      autoResetGeneration += 1;

      if (autoResetTimeout) {
        clearTimeout(
          autoResetTimeout
        );

        autoResetTimeout = null;
      }

      if (autoResetTicker) {
        clearInterval(
          autoResetTicker
        );

        autoResetTicker = null;
      }

      autoResetDeadline = 0;
      clearAutoResetNotice();
    }


    function updateAutoResetCountdown() {
      if (!autoResetDeadline) {
        return;
      }

      const remaining =
        Math.max(
          autoResetDeadline -
          Date.now(),
          0
        );

      const seconds =
        Math.max(
          Math.ceil(
            remaining / 1000
          ),
          0
        );

      autoResetNotice.textContent =
        remaining > 0
          ? "SCAN BERIKUTNYA DALAM " +
            String(seconds) +
            " DETIK"
          : "MEMULAI SCANNER...";
    }


    function scheduleAutoReset(
      delay = 2500
    ) {
      cancelAutoReset();

      if (
        !navigator.onLine ||
        requestInFlight ||
        deliveryProcessing ||
        resetProcessing ||
        hasPendingApprovedDelivery()
      ) {
        if (hasPendingApprovedDelivery()) {
          showHoldNotice(
            "TINDAKAN DIPERLUKAN • SERAHKAN BARANG"
          );
        }

        return;
      }

      const generation =
        autoResetGeneration;

      autoResetDeadline =
        Date.now() + delay;

      autoResetNotice.className =
        "auto-reset-notice";

      autoResetNotice.style.display =
        "block";

      updateAutoResetCountdown();

      autoResetTicker =
        setInterval(
          updateAutoResetCountdown,
          250
        );

      autoResetTimeout =
        setTimeout(
          function() {
            if (
              generation !==
              autoResetGeneration
            ) {
              return;
            }

            if (
              deliveryProcessing ||
              requestInFlight ||
              hasPendingApprovedDelivery() ||
              !navigator.onLine
            ) {
              cancelAutoReset();

              if (
                hasPendingApprovedDelivery()
              ) {
                showHoldNotice(
                  "TINDAKAN DIPERLUKAN • SERAHKAN BARANG"
                );
              }

              return;
            }

            void resetScanner({
              automatic: true,
              source: "auto-reset"
            });
          },
          delay
        );
    }

    /* =========================================================
       CAMERA OPERATIONS
       ========================================================= */

    function queueCameraOperation(
      operation
    ) {
      const next =
        cameraOperation
          .catch(
            function() {
              // Keep the operation queue alive.
            }
          )
          .then(operation);

      cameraOperation =
        next.catch(
          function(error) {
            console.warn(
              "CAMERA OPERATION ERROR:",
              error
            );
          }
        );

      return next;
    }


    async function stopScannerInternal() {
      if (!scanner) {
        scannerPaused = false;
        return;
      }

      try {
        await scanner.stop();
      } catch (error) {
        console.warn(
          "Scanner stop:",
          error
        );
      }

      try {
        await scanner.clear();
      } catch (error) {
        console.warn(
          "Scanner clear:",
          error
        );
      }

      scanner = null;
      scannerPaused = false;
    }


    async function stopScanner() {
      return queueCameraOperation(
        stopScannerInternal
      );
    }


    async function suspendScannerInternal() {
      if (!scanner) {
        return;
      }

      if (
        !scannerPaused &&
        typeof scanner.pause ===
          "function"
      ) {
        try {
          scanner.pause(true);
          scannerPaused = true;
          return;
        } catch (error) {
          console.warn(
            "Scanner pause fallback:",
            error
          );
        }
      }

      await stopScannerInternal();
    }


    async function suspendScannerForResult() {
      return queueCameraOperation(
        suspendScannerInternal
      );
    }


    function createReaderPlaceholder() {
      reader.innerHTML = "";

      showCameraPlaceholder(
        "MEMULAI KAMERA",

    async function startScannerInternal() {
      if (!navigator.onLine) {
        showCameraPlaceholder(
          "OFFLINE",
          "Kamera check-in akan aktif kembali setelah internet tersambung.",
          "📡"
        );

        setScannerStatus(
          "OFFLINE. Check-in dinonaktifkan."
        );

        return false;
      }

      if (
        scanner &&
        scannerPaused &&
        typeof scanner.resume ===
          "function"
      ) {
        try {
          scanner.resume();
          scannerPaused = false;
          hideCameraPlaceholder();

          setScannerStatus(
            "Kamera aktif. Arahkan kamera ke QR code."
          );

          processing = false;
          updateControlState();
          return true;

        } catch (error) {
          console.warn(
            "Scanner resume fallback:",
            error
          );

          await stopScannerInternal();
        }
      }

      if (
        scanner &&
        !scannerPaused
      ) {
        hideCameraPlaceholder();

        setScannerStatus(
          "Kamera aktif. Arahkan kamera ke QR code."
        );

        processing = false;
        updateControlState();
        return true;
      }

      showCameraPlaceholder();

      setScannerStatus(
        "Mencari kamera..."
      );

      if (
        typeof Html5Qrcode ===
        "undefined"
      ) {
        showServerError(
          {
            message:
              "Library scanner QR tidak berhasil dimuat."
          },
          {
            autoReset: false,
            feedback: false,
            lockCycle: false
          }
        );

        return false;
      }

      await stopScannerInternal();
      createReaderPlaceholder();

      scanner =
        new Html5Qrcode(
          "reader",
          {
            verbose: false
          }
        );

      let cameras = [];

      try {
        cameras =
          await Html5Qrcode.getCameras();
      } catch (error) {
        console.error(
          "GET CAMERAS ERROR:",
          error
        );

        setScannerStatus(
          "Browser tidak memberikan akses kamera."
        );

        showServerError(
          {
            message:
              "Kamera tidak dapat diakses. Pastikan izin kamera browser sudah diberikan."
          },
          {
            autoReset: false,
            feedback: false,
            lockCycle: false
          }
        );

        showCameraPlaceholder(
          "KAMERA TIDAK TERSEDIA",
          "Periksa izin kamera atau gunakan token manual.",
          "⚠"
        );

        return false;
      }

      if (
        !cameras ||
        cameras.length === 0
      ) {
        setScannerStatus(
          "Tidak ada kamera yang ditemukan."
        );

        showServerError(
          {
            message:
              "Tidak ada kamera yang tersedia pada perangkat ini."
          },
          {
            autoReset: false,
            feedback: false,
            lockCycle: false
          }
        );

        showCameraPlaceholder(
          "KAMERA TIDAK DITEMUKAN",
          "Gunakan token manual untuk melakukan check-in.",
          "⚠"
        );

        return false;
      }

      let selectedCamera =
        cameras[0];

      const backCamera =
        cameras.find(
          function(camera) {
            const label =
              String(
                camera.label || ""
              ).toLowerCase();

            return (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes(
                "environment"
              )
            );
          }
        );

      if (backCamera) {
        selectedCamera =
          backCamera;
      }

      try {
        setScannerStatus(
          "Mengaktifkan kamera..."
        );

        await scanner.start(
          selectedCamera.id,
          {
            fps: 10,

            qrbox: function(
              viewfinderWidth,
              viewfinderHeight
            ) {
              const minDimension =
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                );

              const size =
                Math.floor(
                  Math.min(
                    minDimension * 0.72,
                    280
                  )
                );

              return {
                width: size,
                height: size
              };
            },

            aspectRatio: 1.0,
            disableFlip: false
          },
          onScanSuccess,
          onScanError
        );

        scannerPaused = false;
        hideCameraPlaceholder();

        setScannerStatus(
          "Kamera aktif. Arahkan kamera ke QR code."
        );

        processing = false;
        updateControlState();
        return true;

      } catch (error) {
        console.error(
          "CAMERA START ERROR:",
          error
        );

        await stopScannerInternal();

        setScannerStatus(
          "Kamera gagal diaktifkan."
        );

        showServerError(
          {
            message:
              "Kamera gagal diaktifkan. Pastikan izin kamera diberikan dan halaman dibuka melalui HTTPS."
          },
          {
            autoReset: false,
            feedback: false,
            lockCycle: false
          }
        );

        showCameraPlaceholder(
          "KAMERA GAGAL AKTIF",
          "Periksa izin kamera atau gunakan token manual.",
          "⚠"
        );

        return false;
      }
    }


    async function startScanner() {
      return queueCameraOperation(
        startScannerInternal
      );
    }


    /* =========================================================
       SCAN PROCESS
       ========================================================= */

    function onScanSuccess(decodedText) {
      const token =
        String(
          decodedText || ""
        ).trim();

      if (!token) {
        return;
      }

      void beginCheckIn(
        token,
        "camera"
      );
    }


    function onScanError() {
      // Normal frame misses are intentionally ignored.
    }


    async function beginCheckIn(
      token,
      source
    ) {
      if (
        processing ||
        requestInFlight ||
        deliveryProcessing ||
        resetProcessing
      ) {
        return;
      }

      const cleanToken =
        String(token || "").trim();

      if (!cleanToken) {
        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        return;
      }

      processing = true;
      cancelAutoReset();
      updateControlState();

      setScannerStatus(
        source === "manual"
          ? "Memeriksa token manual..."
          : "QR terbaca. Memeriksa ke server..."
      );

      await suspendScannerForResult();

      if (!navigator.onLine) {
        showOfflineError();
        return;
      }

      await processToken(
        cleanToken
      );
    }


    function clearCheckInRequestState(
      sequence
    ) {
      if (
        sequence !==
        requestSequence
      ) {
        return false;
      }

      if (requestTimeout) {
        clearTimeout(
          requestTimeout
        );

        requestTimeout = null;
      }

      requestController = null;
      requestInFlight = false;
      updateControlState();
      return true;
    }


    function abortActiveCheckInRequest() {
      requestSequence += 1;

      if (requestTimeout) {
        clearTimeout(
          requestTimeout
        );

        requestTimeout = null;
      }

      if (requestController) {
        try {
          requestController.abort();
        } catch {
          // No action required.
        }
      }

      requestController = null;
      requestInFlight = false;
    }


    async function processToken(token) {
      const cleanToken =
        String(token || "").trim();

      if (!cleanToken) {
        showServerError({
          message: "QR token kosong."
        });

        return;
      }

      if (!navigator.onLine) {
        showOfflineError();
        return;
      }

      showLoading();

      setScannerStatus(
        "Menghubungi server Supabase..."
      );

      requestInFlight = true;
      updateControlState();

      const sequence =
        ++requestSequence;

      const controller =
        new AbortController();

      requestController =
        controller;

      let timedOut = false;

      requestTimeout =
        setTimeout(
          function() {
            timedOut = true;

            try {
              controller.abort();
            } catch {
              // No action required.
            }
          },
          15000
        );

      try {
        const response =
          await fetch(
            API_URL +
              "?action=checkIn",
            {
              method: "POST",
              cache: "no-store",
              signal: controller.signal,
              headers: {
                ...(
                  await getScannerAuthHeaders()
                ),
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                token: cleanToken
              })
            }
          );

        if (
          sequence !==
          requestSequence
        ) {
          return;
        }

        const rawResponse =
          await response.text();

        let data = null;

        try {
          data =
            JSON.parse(
              rawResponse
            );
        } catch (error) {
          console.error(
            "JSON PARSE ERROR:",
            error,
            rawResponse
          );

          clearCheckInRequestState(
            sequence
          );

          showServerError({
            message:
              "Server mengembalikan response JSON yang tidak valid."
          });

          return;
        }

        clearCheckInRequestState(
          sequence
        );

        showResult(data);

      } catch (error) {
        if (
          sequence !==
          requestSequence
        ) {
          return;
        }

        clearCheckInRequestState(
          sequence
        );

        console.error(
          "CHECK-IN REQUEST ERROR:",
          error
        );

        if (!navigator.onLine) {
          showOfflineError();
          return;
        }

        if (
          error &&
          error.name === "AbortError" &&
          timedOut
        ) {
          showServerError({
            message:
              "Server check-in tidak memberikan respons dalam 15 detik."
          });

          return;
        }

        showServerError({
          message:
            error && error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });
      }
    }


    function manualCheckIn() {
      const token =
        manualToken.value.trim();

      if (!token) {
        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();
        return;
      }

      void beginCheckIn(
        token,
        "manual"
      );
    }


    /* =========================================================
       PURCHASE HELPERS
       ========================================================= */

    function formatCurrency(value) {
      const number =
        Number(value || 0);

      return new Intl.NumberFormat(
        "id-ID",
        {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }
      ).format(number);
    }


    function formatDateTime(value) {
      if (!value) {
        return "-";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return String(value);
      }

      return new Intl.DateTimeFormat(
        "id-ID",
        {
          dateStyle: "medium",
          timeStyle: "short",
          timeZone: "Asia/Jakarta"
        }
      ).format(date);
    }


    function getPaymentClass(status) {
      const normalized =
        String(status || "")
          .toUpperCase();

      if (normalized === "APPROVED") {
        return "payment-approved";
      }

      if (normalized === "REJECTED") {
        return "payment-rejected";
      }

      return "payment-pending";
    }


    function buildPurchaseHtml(purchase) {
      if (!purchase) {
        return `
          <div class="no-purchase">
            TIDAK ADA PEMBELIAN TAMBAHAN
          </div>
        `;
      }

      const paymentStatus =
        String(
          purchase.paymentStatus || "-"
        ).toUpperCase();

      const itemDelivered =
        purchase.itemDelivered === true;

      let deliveryHtml = "";

      if (
        paymentStatus === "APPROVED" &&
        itemDelivered
      ) {
        deliveryHtml = `
          <div class="delivery-badge delivery-done">
            ✓ BARANG SUDAH DIBERIKAN
          </div>

          <div class="detail">
            <strong>WAKTU PENYERAHAN</strong><br>
            ${escapeHtml(
              formatDateTime(
                purchase.itemDeliveredAt
              )
            )}
          </div>

          <div class="delivery-warning">
            JANGAN BERIKAN BARANG LAGI
          </div>
        `;

      } else if (
        paymentStatus === "APPROVED"
      ) {
        deliveryHtml = `
          <div class="delivery-badge delivery-ready">
            BARANG SIAP DISERAHKAN
          </div>

          <button
            type="button"
            class="deliver-button"
            id="deliverItemButton"
          >
            ✓ SERAHKAN ${escapeHtml(
              purchase.quantity
            )} ${escapeHtml(
              purchase.unitName || "UNIT"
            )}
          </button>

          <div
            id="deliveryInlineMessage"
            class="delivery-inline-message"
            role="status"
            aria-live="polite"
          ></div>
        `;

      } else if (
        paymentStatus === "REJECTED"
      ) {
        deliveryHtml = `
          <div class="delivery-badge delivery-blocked">
            ✕ JANGAN SERAHKAN BARANG
          </div>

          <div class="delivery-warning">
            PEMBAYARAN DITOLAK
          </div>
        `;

      } else {
        deliveryHtml = `
          <div class="delivery-badge delivery-blocked">
            ⚠ JANGAN SERAHKAN BARANG
          </div>

          <div class="delivery-warning">
            PEMBAYARAN BELUM APPROVED
          </div>
        `;
      }

      return `
        <div class="purchase-panel">
          <div class="purchase-heading">
            BARANG PEMBELIAN
          </div>

          <div class="purchase-product">
            ${escapeHtml(
              purchase.productName || "-"
            )}
          </div>

          <div class="purchase-qty">
            ${escapeHtml(
              purchase.quantity
            )}
            ${escapeHtml(
              purchase.unitName || "unit"
            )}
          </div>

          <div class="purchase-grid">
            <div class="purchase-field">
              <div class="purchase-field-label">
                PURCHASE ID
              </div>
              <div class="purchase-field-value">
                ${escapeHtml(
                  purchase.purchaseId || "-"
                )}
              </div>
            </div>

            <div class="purchase-field">
              <div class="purchase-field-label">
                TOTAL
              </div>
              <div class="purchase-field-value">
                ${escapeHtml(
                  formatCurrency(
                    purchase.totalAmount
                  )
                )}
              </div>
            </div>
          </div>

          <div class="payment-badge ${getPaymentClass(
            paymentStatus
          )}">
            PAYMENT ${escapeHtml(
              paymentStatus
            )}
          </div>

          ${deliveryHtml}
        </div>
      `;
    }


    function bindDeliveryButton() {
      const button =
        document.getElementById(
          "deliverItemButton"
        );

      if (!button) {
        return;
      }

      button.addEventListener(
        "click",
        deliverCurrentItem
      );

      updateControlState();
    }


    function showDeliveryInlineMessage(
      message,
      type = "error"
    ) {
      const box =
        document.getElementById(
          "deliveryInlineMessage"
        );

      if (!box) {
        return;
      }

      box.textContent =
        message || "";

      box.className =
        "delivery-inline-message " +
        type;

      box.style.display =
        message
          ? "block"
          : "none";
    }


    function refreshPurchaseDisplay() {
      const purchaseContainer =
        document.getElementById(
          "purchaseResultContainer"
        );

      if (!purchaseContainer) {
        return;
      }

      purchaseContainer.innerHTML =
        buildPurchaseHtml(
          currentPurchase
        );

      bindDeliveryButton();
    }


    function clearDeliveryRequestState() {
      if (deliveryRequestTimeout) {
        clearTimeout(
          deliveryRequestTimeout
        );

        deliveryRequestTimeout = null;
      }

      deliveryRequestController =
        null;

      deliveryProcessing = false;
      updateControlState();
    }


    async function deliverCurrentItem() {
      if (
        deliveryProcessing ||
        !currentPurchase ||
        !currentPurchase.purchaseId
      ) {
        return;
      }

      cancelAutoReset();

      if (!navigator.onLine) {
        showDeliveryInlineMessage(
          "OFFLINE. Sambungkan internet sebelum mengonfirmasi penyerahan."
        );

        setScannerStatus(
          "OFFLINE. Penyerahan tidak dikirim ke server."
        );

        return;
      }

      if (
        String(
          currentPurchase.paymentStatus || ""
        ).toUpperCase() !== "APPROVED"
      ) {
        showDeliveryInlineMessage(
          "Barang tidak boleh diserahkan karena pembayaran belum APPROVED."
        );

        return;
      }

      if (
        currentPurchase.itemDelivered ===
        true
      ) {
        showDeliveryInlineMessage(
          "Barang sudah pernah diserahkan.",
          "warning"
        );

        return;
      }

      deliveryProcessing = true;
      updateControlState();

      const confirmed =
        window.confirm(
          "Konfirmasi barang sudah benar-benar diberikan?\n\n" +
          String(
            currentPurchase.productName ||
            "Produk"
          ) +
          "\n" +
          String(
            currentPurchase.quantity || 0
          ) +
          " " +
          String(
            currentPurchase.unitName ||
            "unit"
          )
        );

      if (!confirmed) {
        deliveryProcessing = false;

        showHoldNotice(
          "TINDAKAN DIPERLUKAN • SERAHKAN BARANG"
        );

        updateControlState();
        return;
      }

      const button =
        document.getElementById(
          "deliverItemButton"
        );

      if (button) {
        button.disabled = true;
        button.textContent =
          "MENYIMPAN...";
      }

      showDeliveryInlineMessage(
        "Menyimpan konfirmasi ke server...",
        "info"
      );

      setScannerStatus(
        "Menyimpan penyerahan barang..."
      );

      const controller =
        new AbortController();

      deliveryRequestController =
        controller;

      let timedOut = false;
      let completed = false;

      deliveryRequestTimeout =
        setTimeout(
          function() {
            timedOut = true;

            try {
              controller.abort();
            } catch {
              // No action required.
            }
          },
          15000
        );

      try {
        const response =
          await fetch(
            API_URL +
              "?action=deliverItem",
            {
              method: "POST",
              cache: "no-store",
              signal: controller.signal,
              headers: {
                ...(
                  await getScannerAuthHeaders()
                ),
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                purchaseId:
                  currentPurchase.purchaseId
              })
            }
          );

        const raw =
          await response.text();

        let data = null;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            "Server mengembalikan response penyerahan yang tidak valid."
          );
        }

        if (
          data &&
          data.purchase
        ) {
          currentPurchase = {
            ...currentPurchase,
            ...data.purchase
          };
        }

        if (
          data &&
          (
            data.status === "DELIVERED" ||
            data.status ===
              "ALREADY_DELIVERED"
          )
        ) {
          completed = true;

          currentPurchase = {
            ...currentPurchase,
            itemDelivered: true
          };

          refreshPurchaseDisplay();

          setScannerStatus(
            data.status === "DELIVERED"
              ? "Barang berhasil dikonfirmasi sudah diserahkan."
              : "Barang sudah dikonfirmasi oleh petugas lain."
          );

          clearDeliveryRequestState();
          triggerFeedback(
            "ITEM_DELIVERED"
          );

          scheduleAutoReset(2200);
          return;
        }

        throw new Error(
          data && data.message
            ? data.message
            : "Gagal mengonfirmasi penyerahan barang."
        );

      } catch (error) {
        console.error(
          "DELIVER ITEM ERROR:",
          error
        );

        let message =
          error && error.message
            ? error.message
            : "Gagal mengonfirmasi penyerahan barang.";

        if (!navigator.onLine) {
          message =
            "Koneksi terputus. Penyerahan belum tersimpan di server.";
        } else if (
          error &&
          error.name === "AbortError" &&
          timedOut
        ) {
          message =
            "Server penyerahan tidak memberikan respons dalam 15 detik.";
        }

        showDeliveryInlineMessage(
          message
        );

        setScannerStatus(
          message
        );

      } finally {
        if (!completed) {
          clearDeliveryRequestState();

          const latestButton =
            document.getElementById(
              "deliverItemButton"
            );

          if (latestButton) {
            latestButton.textContent =
              "✓ SERAHKAN " +
              String(
                currentPurchase.quantity ||
                0
              ) +
              " " +
              String(
                currentPurchase.unitName ||
                "UNIT"
              );
          }

          if (hasPendingApprovedDelivery()) {
            showHoldNotice(
              "TINDAKAN DIPERLUKAN • SERAHKAN BARANG"
            );
          }
        }
      }
    }


    /* =========================================================
       RESULT UI
       ========================================================= */

    function prepareResult(className) {
      cancelAutoReset();

      result.className =
        "result " + className;

      result.style.display =
        "block";

      processing = true;
      updateControlState();
    }


    function finalizeResult(options) {
      const feedback =
        options && options.feedback;

      const autoResetDelay =
        options &&
        Number(options.autoResetDelay || 0);

      if (feedback) {
        triggerFeedback(feedback);
      }

      updateControlState();
      scrollResultIntoView();

      if (hasPendingApprovedDelivery()) {
        showHoldNotice(
          "TINDAKAN DIPERLUKAN • SERAHKAN BARANG"
        );

        return;
      }

      if (autoResetDelay > 0) {
        scheduleAutoReset(
          autoResetDelay
        );
      }
    }


    function showResult(data) {
      const status =
        String(
          data && data.status
            ? data.status
            : ""
        ).toUpperCase();

      if (status === "VALID") {
        prepareResult("valid");

        resultTitle.textContent =
          "✓ ENTRY APPROVED";

        currentPurchase =
          data.purchase || null;

        resultDetails.innerHTML = `
          <div class="detail primary-detail">
            <strong>NAMA</strong><br>
            ${escapeHtml(data.name)}
          </div>

          <div class="detail">
            <strong>PASS ID</strong><br>
            ${escapeHtml(data.passId)}
          </div>

          <div class="detail">
            <strong>ACCESS</strong><br>
            ${escapeHtml(data.accessType)}
          </div>

          <div class="detail">
            <strong>CHECK-IN</strong><br>
            ${escapeHtml(
              formatDateTime(
                data.checkInTime
              )
            )}
          </div>

          <div id="purchaseResultContainer">
            ${buildPurchaseHtml(
              currentPurchase
            )}
          </div>
        `;

        bindDeliveryButton();

        setScannerStatus(
          hasPendingApprovedDelivery()
            ? "Check-in berhasil. Serahkan barang sebelum melanjutkan."
            : "Check-in berhasil."
        );

        finalizeResult({
          feedback: "VALID",
          autoResetDelay: 2500
        });

        return;
      }

      if (
        status === "ALREADY_USED" ||
        status === "USED"
      ) {
        prepareResult("used");

        resultTitle.textContent =
          "⚠ ALREADY USED";

        currentPurchase =
          data.purchase || null;

        resultDetails.innerHTML = `
          <div class="detail primary-detail">
            <strong>QR INI SUDAH DIGUNAKAN</strong>
          </div>

          <div class="detail">
            <strong>NAMA</strong><br>
            ${escapeHtml(data.name)}
          </div>

          <div class="detail">
            <strong>PASS ID</strong><br>
            ${escapeHtml(data.passId)}
          </div>

          <div class="detail">
            <strong>ACCESS</strong><br>
            ${escapeHtml(data.accessType)}
          </div>

          <div class="detail">
            <strong>CHECK-IN PERTAMA</strong><br>
            ${escapeHtml(
              formatDateTime(
                data.checkInTime
              )
            )}
          </div>

          <div id="purchaseResultContainer">
            ${buildPurchaseHtml(
              currentPurchase
            )}
          </div>
        `;

        bindDeliveryButton();

        setScannerStatus(
          hasPendingApprovedDelivery()
            ? "QR sudah digunakan. Barang masih harus diserahkan."
            : currentPurchase &&
              currentPurchase.itemDelivered ===
                true
              ? "QR sudah digunakan dan barang sudah pernah diserahkan."
              : "QR sudah pernah digunakan."
        );

        finalizeResult({
          feedback: "ALREADY_USED",
          autoResetDelay: 2700
        });

        return;
      }

      const invalidStatuses =
        new Set([
          "INVALID",
          "NOT_FOUND",
          "CANCELLED",
          "BLOCKED",
          "INVALID_PASS_STATUS"
        ]);

      if (invalidStatuses.has(status)) {
        prepareResult("invalid");
        currentPurchase = null;

        resultTitle.textContent =
          status === "CANCELLED"
            ? "✕ PASS CANCELLED"
            : "✕ INVALID QR";

        resultDetails.innerHTML = `
          <div class="detail primary-detail">
            ${escapeHtml(
              data.message ||
              "QR tidak terdaftar."
            )}
          </div>
        `;

        setScannerStatus(
          "QR tidak valid."
        );

        finalizeResult({
          feedback: "INVALID",
          autoResetDelay: 2600
        });

        return;
      }

      if (
        status === "UNAUTHORIZED" ||
        status === "FORBIDDEN"
      ) {
        showServerError(
          {
            message:
              data && data.message
                ? data.message
                : "Sesi scanner tidak valid."
          },
          {
            autoReset: false,
            feedback: true
          }
        );

        showHoldNotice(
          "SESI TIDAK VALID • KEMBALI KE ADMIN"
        );

        return;
      }

      showServerError({
        message:
          data && data.message
            ? data.message
            : "Terjadi kesalahan pada server check-in."
      });
    }


    function showLoading() {
      cancelAutoReset();
      currentPurchase = null;

      result.className =
        "result loading";

      result.style.display =
        "block";

      resultTitle.textContent =
        "CHECKING...";

      resultDetails.innerHTML = `
        <div class="detail primary-detail">
          Memverifikasi QR ke Supabase...
        </div>
      `;

      clearAutoResetNotice();
      updateControlState();
      scrollResultIntoView();
    }


    function showServerError(
      error,
      options = {}
    ) {
      cancelAutoReset();
      currentPurchase = null;

      if (
        options.lockCycle !== false
      ) {
        processing = true;
      }

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML = `
        <div class="detail primary-detail">
          ${escapeHtml(
            error && error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
          )}
        </div>
      `;

      setScannerStatus(
        "Terjadi kesalahan."
      );

      if (options.feedback !== false) {
        triggerFeedback("INVALID");
      }

      updateControlState();
      scrollResultIntoView();

      if (
        options.autoReset !== false &&
        navigator.onLine
      ) {
        scheduleAutoReset(3000);
      }
    }


    function showOfflineError() {
      cancelAutoReset();
      currentPurchase = null;
      processing = true;

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "OFFLINE";

      resultDetails.innerHTML = `
        <div class="detail primary-detail">
          Check-in tidak dikirim dan tidak disimpan secara lokal.
          Sambungkan internet agar server Supabase dapat memverifikasi QR.
        </div>
      `;

      showHoldNotice(
        "MENUNGGU KONEKSI INTERNET"
      );

      showCameraPlaceholder(
        "OFFLINE",
        "Scanner akan aktif kembali setelah internet tersambung.",
        "📡"
      );

      setScannerStatus(
        "OFFLINE. Check-in dinonaktifkan."
      );

      updateControlState();
      scrollResultIntoView();
    }


    function showTemporaryError(message) {
      processing = true;
      currentPurchase = null;

      prepareResult("invalid");

      resultTitle.textContent =
        "✕ INVALID";

      resultDetails.innerHTML = `
        <div class="detail primary-detail">
          ${escapeHtml(message)}
        </div>
      `;

      setScannerStatus(
        "Input tidak valid."
      );

      finalizeResult({
        feedback: "INVALID",
        autoResetDelay: 2000
      });
    }


    /* =========================================================
       RESET
       ========================================================= */

    async function resetScanner(
      options = {}
    ) {
      const automatic =
        options.automatic === true;

      if (
        resetProcessing ||
        requestInFlight ||
        deliveryProcessing
      ) {
        return;
      }

      if (
        automatic &&
        hasPendingApprovedDelivery()
      ) {
        showHoldNotice(
          "TINDAKAN DIPERLUKAN • SERAHKAN BARANG"
        );

        return;
      }

      resetProcessing = true;
      cancelAutoReset();
      abortActiveCheckInRequest();
      updateControlState();

      result.style.display =
        "none";

      result.className =
        "result";

      resultTitle.textContent = "";
      resultDetails.innerHTML = "";
      clearAutoResetNotice();

      manualToken.value = "";
      currentPurchase = null;
      processing = false;

      try {
        if (!navigator.onLine) {
          showOfflineError();
          return;
        }

        await startScanner();
        scrollScannerIntoView();

      } finally {
        resetProcessing = false;
        updateControlState();
      }
    }


    /* =========================================================
       EVENTS

    homeButton.addEventListener(
      "click",
      function(event) {
        event.preventDefault();

        const target =
          navigationConfig.home ||
          FALLBACK_NAVIGATION.home;

        window.location.href =
          target;
      }
    );


    manualButton.addEventListener(
      "click",
      manualCheckIn
    );


    resetButton.addEventListener(
      "click",
      function() {
        void resetScanner({
          automatic: false,
          source: "manual-button"
        });
      }
    );


    manualToken.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          manualCheckIn();
        }
      }
    );


    manualToken.addEventListener(
      "input",
      updateControlState
    );


    audioButton.addEventListener(
      "click",
      function() {
        void unlockAudio(true);
      }
    );


    document.addEventListener(
      "pointerdown",
      function() {
        void unlockAudio(false);
      },
      {
        once: true,
        passive: true,
        capture: true
      }
    );


    window.addEventListener(
      "online",
      function() {
        void handleOnline();
      }
    );


    window.addEventListener(
      "offline",
      function() {
        void handleOffline();
      }
    );


    window.addEventListener(
      "beforeunload",
      function() {
        cancelAutoReset();
        abortActiveCheckInRequest();

        if (deliveryRequestController) {
          try {
            deliveryRequestController.abort();
          } catch {
            // No action required.
          }
        }

        if (scanner) {
          try {
            const stopResult =
              scanner.stop();

            if (
              stopResult &&
              typeof stopResult.catch ===
                "function"
            ) {
              stopResult.catch(
                function() {
                  // Page is closing.
                }
              );
            }
          } catch {
            // Page is closing.
          }
        }
      }
    );


    /* =========================================================
       PAGE INITIALIZATION
       ========================================================= */

    window.addEventListener(
      "DOMContentLoaded",
      async function() {
        console.log(
          "BOLD AFTER DARK HIGH-SPEED SCANNER INITIALIZING..."
        );

        loadNavigationConfig();
        updateConnectionStatus();
        updateAudioButton();
        updateControlState();

        const allowed =
          await requireScannerAccess();

        if (!allowed) {
          return;
        }

        if (!navigator.onLine) {
          processing = true;
          showOfflineError();
          return;
        }

        await startScanner();
      }
    );


    /* =========================================================
       DEBUG
       ========================================================= */

    window.addEventListener(
      "error",
      function(event) {
        console.error(
          "PAGE ERROR:",
          event.error ||
          event.message
        );
      }
    );


  </script>

</body>
</html>
