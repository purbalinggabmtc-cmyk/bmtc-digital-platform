<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOLD AFTER DARK — CHECK IN V6</title>

  <!-- =========================================================
       QR SCANNER LIBRARY
       ========================================================= -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>

  <!-- =========================================================
       NAVIGATION CONFIG
       =========================================================

       navigation.js sebaiknya berisi:

       window.BOLD_AFTER_DARK_NAVIGATION = Object.freeze({
         home: "https://bmtc.my.id/bold-after-dark/index.html",
         admin: "https://bmtc.my.id/bold-after-dark/admin.html",
         report: "https://bmtc.my.id/bold-after-dark/report.html",
         scanner: "https://bmtc.my.id/bold-after-dark/scanner.html",
         registration: "https://bmtc.my.id/bold-after-dark/registration/index.html"
       });

       ========================================================= -->

  <script src="/bold-after-dark/config/navigation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/js/admin-auth.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #2a0000 0%,
          #080808 45%,
          #000000 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* =========================================================
       TOP NAV
       ========================================================= */

    .top-nav {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 11px 16px;

      background: #111111;

      color: #ffffff;

      border: 1px solid #444444;

      border-radius: 8px;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.5px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .home-button:hover {
      background: #1d1d1d;
      border-color: #e00000;
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .brand .bold {
      color: #ffffff;
    }

    .brand .after {
      color: #e00000;
    }

    .brand .dark {
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      color: #aaaaaa;
      margin-bottom: 24px;
    }

    /* =========================================================
       SCANNER CARD
       ========================================================= */

    .scanner-card {
      background: #111111;

      border: 1px solid #333333;

      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 0 30px rgba(255, 0, 0, 0.12);
    }

    #reader {
      width: 100%;

      min-height: 280px;

      overflow: hidden;

      border-radius: 12px;

      background: #050505;

      position: relative;
    }

    #reader video {
      width: 100% !important;

      max-width: 100% !important;

      height: auto !important;

      display: block;

      border-radius: 10px;
    }

    #reader img {
      max-width: 100%;
    }

    #reader__dashboard {
      color: #ffffff;
      background: #111111;
    }

    #reader__dashboard_section {
      padding: 10px !important;
    }

    #reader button {
      background: #e00000 !important;

      color: #ffffff !important;

      border: none !important;

      border-radius: 7px !important;

      padding: 9px 12px !important;

      font-weight: 700 !important;
    }

    #reader select {
      background: #222222 !important;

      color: #ffffff !important;

      border: 1px solid #444444 !important;

      border-radius: 7px !important;

      padding: 8px !important;
    }

    /* =========================================================
       CAMERA PLACEHOLDER
       ========================================================= */

    .camera-placeholder {
      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 20px;

      color: #777777;

      background: #050505;

      text-align: center;

      pointer-events: none;

      z-index: 1;
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .camera-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .camera-placeholder-title {
      color: #aaaaaa;

      font-size: 14px;

      font-weight: 800;

      margin-bottom: 6px;
    }

    .camera-placeholder-text {
      color: #666666;

      font-size: 11px;

      line-height: 1.5;
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status-text {
      margin-top: 12px;

      font-size: 12px;

      color: #888888;

      min-height: 18px;

      line-height: 1.5;
    }

    /* =========================================================
       NAVIGATION ERROR
       ========================================================= */

    .navigation-error {
      display: none;

      margin-top: 12px;

      padding: 10px 12px;

      background: rgba(224, 0, 0, 0.1);

      border:
        1px solid
        rgba(224, 0, 0, 0.4);

      border-radius: 8px;

      color: #ff8b8b;

      font-size: 11px;

      line-height: 1.5;

      text-align: left;
    }

    /* =========================================================
       MANUAL TOKEN
       ========================================================= */

    .manual {
      margin-top: 18px;

      display: flex;

      gap: 8px;
    }

    .manual input {
      flex: 1;

      min-width: 0;

      padding: 14px;

      background: #1c1c1c;

      color: #ffffff;

      border: 1px solid #444444;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    .manual input::placeholder {
      color: #777777;
    }

    .manual input:focus {
      border-color: #e00000;

      box-shadow:
        0 0 0 2px rgba(224, 0, 0, 0.12);
    }

    .manual button {
      padding: 14px 18px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }

    .manual button:hover {
      background: #ff0000;
    }

    .manual button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    /* =========================================================
       RESULT
       ========================================================= */

    .result {
      margin-top: 18px;

      padding: 20px;

      border-radius: 14px;

      display: none;
    }

    .result.valid {
      display: block;

      background: #062d16;

      border: 2px solid #16c75a;
    }

    .result.used {
      display: block;

      background: #2d2100;

      border: 2px solid #e2b400;
    }

    .result.invalid {
      display: block;

      background: #300000;

      border: 2px solid #e00000;
    }

    .result.error {
      display: block;

      background: #222222;

      border: 2px solid #777777;
    }

    .result-title {
      font-size: 28px;

      font-weight: 900;

      margin-bottom: 12px;
    }

    .valid .result-title {
      color: #16c75a;
    }

    .used .result-title {
      color: #e2b400;
    }

    .invalid .result-title {
      color: #ff3333;
    }

    .error .result-title {
      color: #ffffff;
    }

    .detail {
      margin-top: 8px;

      font-size: 15px;

      color: #dddddd;

      line-height: 1.5;
    }

    .detail strong {
      color: #ffffff;
    }


    /* =========================================================
       PURCHASE / ITEM DELIVERY
       ========================================================= */

    .purchase-panel {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.14);
      text-align: left;
    }

    .purchase-heading {
      margin-bottom: 12px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .purchase-product {
      margin-bottom: 4px;
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.25;
    }

    .purchase-qty {
      margin-bottom: 14px;
      color: #ffffff;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
    }

    .purchase-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .purchase-field {
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .purchase-field-label {
      margin-bottom: 4px;
      color: #888888;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .purchase-field-value {
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .payment-badge,
    .delivery-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .payment-approved {
      background: rgba(22, 199, 90, 0.15);
      border: 1px solid #16c75a;
      color: #7dffa9;
    }

    .payment-pending {
      background: rgba(226, 180, 0, 0.14);
      border: 1px solid #e2b400;
      color: #ffe16a;
    }

    .payment-rejected {
      background: rgba(224, 0, 0, 0.14);
      border: 1px solid #e00000;
      color: #ff8b8b;
    }

    .delivery-ready {
      background: rgba(22, 199, 90, 0.15);
      border: 1px solid #16c75a;
      color: #7dffa9;
    }

    .delivery-done {
      background: rgba(226, 180, 0, 0.14);
      border: 1px solid #e2b400;
      color: #ffe16a;
    }

    .delivery-blocked {
      background: rgba(224, 0, 0, 0.14);
      border: 1px solid #e00000;
      color: #ff8b8b;
    }

    .deliver-button {
      width: 100%;
      margin-top: 14px;
      padding: 16px 14px;
      border: 0;
      border-radius: 10px;
      background: #16c75a;
      color: #03160a;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .deliver-button:hover {
      background: #26e56d;
    }

    .deliver-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .delivery-warning {
      margin-top: 12px;
      padding: 12px;
      border-radius: 9px;
      background: rgba(224, 0, 0, 0.13);
      border: 1px solid rgba(224, 0, 0, 0.55);
      color: #ff9d9d;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.5;
      text-align: center;
    }

    .no-purchase {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      border: 1px dashed #555555;
      color: #aaaaaa;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 480px) {
      .purchase-grid {
        grid-template-columns: 1fr;
      }

      .purchase-product {
        font-size: 18px;
      }

      .purchase-qty {
        font-size: 26px;
      }
    }

    /* =========================================================
       RESET
       ========================================================= */

    .reset {
      margin-top: 18px;

      width: 100%;

      padding: 14px;

      background: #e00000;

      color: #ffffff;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      font-size: 15px;
    }

    .reset:hover {
      background: #ff0000;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 20px;

      font-size: 11px;

      color: #666666;

      letter-spacing: 2px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .top-nav {
        margin-bottom: 14px;
      }

      .home-button {
        width: 100%;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .scanner-card {
        padding: 12px;

        border-radius: 15px;
      }

      #reader {
        min-height: 250px;
      }

      .manual {
        flex-direction: column;
      }

      .manual button {
        width: 100%;
      }

      .result {
        padding: 18px 14px;
      }

      .result-title {
        font-size: 22px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- =======================================================
         HOME
         ======================================================= -->

    <div class="top-nav">

      <a
        href="#"
        id="homeButton"
        class="home-button"
      >
        ← HOME
      </a>

    </div>

    <!-- =======================================================
         BRAND
         ======================================================= -->

    <div class="brand">
      <span class="bold">BOLD</span>
      <span class="after"> AFTER</span>
      <span class="dark"> DARK</span>
    </div>

    <div class="subtitle">
      EVENT CHECK-IN
    </div>

    <!-- =======================================================
         SCANNER
         ======================================================= -->

    <div class="scanner-card">

      <div id="reader">

        <div
          id="cameraPlaceholder"
          class="camera-placeholder"
        >

          <div class="camera-icon">
            📷
          </div>

          <div class="camera-placeholder-title">
            MEMULAI KAMERA
          </div>

          <div class="camera-placeholder-text">
            Izinkan akses kamera ketika browser memintanya.
          </div>

        </div>

      </div>

      <div
        id="scannerStatus"
        class="status-text"
      >
        Menyiapkan scanner...
      </div>

      <!-- =====================================================
           NAVIGATION ERROR
           ===================================================== -->

      <div
        id="navigationError"
        class="navigation-error"
      ></div>

      <!-- =====================================================
           MANUAL TOKEN
           ===================================================== -->

      <div class="manual">

        <input
          id="manualToken"
          type="text"
          placeholder="Masukkan QR token"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          type="button"
          id="manualButton"
        >
          CHECK
        </button>

      </div>

      <!-- =====================================================
           RESULT
           ===================================================== -->

      <div
        id="result"
        class="result"
      >

        <div
          id="resultTitle"
          class="result-title"
        ></div>

        <div id="resultDetails"></div>

        <button
          type="button"
          id="resetButton"
          class="reset"
        >
          SCAN BERIKUTNYA
        </button>

      </div>

    </div>

    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <div class="footer">
      BOLD AFTER DARK • THE NIGHT STARTS HERE
    </div>

  </div>

  <script>

    "use strict";

    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
      "https://yrvnmmascklkuzpjkwxn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YGi3tPBuF9tW4KKnLJ5dDQ_AcBZ19WH";

    const API_URL =
      SUPABASE_URL +
      "/functions/v1/dynamic-service";


    /* =========================================================
       FALLBACK NAVIGATION
       =========================================================

       Kamera TIDAK bergantung pada navigation.js.

       Jika navigation.js gagal dimuat,
       kamera tetap bisa aktif.

       ========================================================= */

    const FALLBACK_NAVIGATION = Object.freeze({

      home:
        "https://bmtc.my.id/bold-after-dark/index.html",

      admin:
        "https://bmtc.my.id/bold-after-dark/admin.html",

      report:
        "https://bmtc.my.id/bold-after-dark/report.html",

      scanner:
        "https://bmtc.my.id/bold-after-dark/scanner.html",

      registration:
        "https://bmtc.my.id/bold-after-dark/registration/index.html"

    });


    /* =========================================================
       STATE
       ========================================================= */

    let scanner = null;

    let processing = false;

    let requestTimeout = null;

    let navigationConfig =
      FALLBACK_NAVIGATION;

    let currentAdminAccess =
      null;

    let currentPurchase =
      null;

    let deliveryProcessing =
      false;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const homeButton =
      document.getElementById(
        "homeButton"
      );

    const reader =
      document.getElementById(
        "reader"
      );

    const cameraPlaceholder =
      document.getElementById(
        "cameraPlaceholder"
      );

    const scannerStatus =
      document.getElementById(
        "scannerStatus"
      );

    const navigationError =
      document.getElementById(
        "navigationError"
      );

    const manualToken =
      document.getElementById(
        "manualToken"
      );

    const manualButton =
      document.getElementById(
        "manualButton"
      );

    const result =
      document.getElementById(
        "result"
      );

    const resultTitle =
      document.getElementById(
        "resultTitle"
      );

    const resultDetails =
      document.getElementById(
        "resultDetails"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );


    /* =========================================================
       CENTRAL ADMIN AUTH / RBAC
       ========================================================= */

    async function requireScannerAccess() {

      try {

        currentAdminAccess =
          await window.BMTC_ADMIN_AUTH
            .requirePermission(
              "scanner.use"
            );

        return true;

      } catch (error) {

        const message =
          error &&
          error.message
            ? error.message
            : "Akses scanner gagal.";

        if (
          message === "AUTH_REQUIRED"
        ) {

          window.BMTC_ADMIN_AUTH
            .redirectToAdmin();

          return false;

        }

        if (
          message === "FORBIDDEN"
        ) {

          document.body.innerHTML =
            '<div style="padding:30px;color:#fff;font-family:Arial;background:#050505;min-height:100vh">' +
            '<h2>Akses Ditolak</h2>' +
            '<p>Akun Anda tidak memiliki permission <strong>scanner.use</strong>.</p>' +
            '<p><a href="/admin/" style="color:#ff6b6b">Kembali ke Admin Dashboard</a></p>' +
            '</div>';

          return false;

        }

        showServerError({
          message: message
        });

        return false;

      }

    }


    async function getScannerAuthHeaders() {

      const sessionResult =
        await window.BMTC_ADMIN_AUTH
          .client
          .auth
          .getSession();

      const session =
        sessionResult.data &&
        sessionResult.data.session;

      if (!session) {

        throw new Error(
          "AUTH_REQUIRED"
        );

      }

      return {

        "Accept":
          "application/json",

        "apikey":
          SUPABASE_PUBLISHABLE_KEY,

        "Authorization":
          "Bearer " +
          session.access_token

      };

    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    function loadNavigationConfig() {

      try {

        const config =
          window.BOLD_AFTER_DARK_NAVIGATION;

        if (
          !config ||
          typeof config !== "object"
        ) {

          throw new Error(
            "window.BOLD_AFTER_DARK_NAVIGATION tidak ditemukan."
          );

        }

        const pages = [
          "home",
          "admin",
          "report",
          "scanner",
          "registration"
        ];

        for (
          const page of pages
        ) {

          if (
            typeof config[page] !== "string" ||
            !config[page].trim()
          ) {

            throw new Error(
              "URL " +
              page +
              " tidak tersedia."
            );

          }

        }

        navigationConfig =
          Object.freeze({
            home: config.home,
            admin: config.admin,
            report: config.report,
            scanner: config.scanner,
            registration: config.registration
          });

        homeButton.href =
          navigationConfig.home;

        navigationError.style.display =
          "none";

        console.log(
          "Navigation loaded:",
          navigationConfig
        );

        return true;

      } catch (error) {

        console.warn(
          "Navigation config tidak dapat dimuat:",
          error
        );

        navigationConfig =
          FALLBACK_NAVIGATION;

        /*
         * FALLBACK tetap membuat HOME
         * mengarah ke alamat yang benar.
         */

        homeButton.href =
          FALLBACK_NAVIGATION.home;

        navigationError.textContent =
          "navigation.js tidak dapat dimuat. " +
          "Navigasi menggunakan alamat fallback.";

        navigationError.style.display =
          "block";

        return false;

      }

    }


    /* =========================================================
       HOME
       ========================================================= */

    homeButton.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        const target =
          navigationConfig.home ||
          FALLBACK_NAVIGATION.home;

        window.location.href =
          target;

      }
    );


    /* =========================================================
       STATUS
       ========================================================= */

    function setScannerStatus(
      text
    ) {

      scannerStatus.textContent =
        text || "";

    }


    /* =========================================================
       CAMERA PLACEHOLDER
       ========================================================= */

    function hideCameraPlaceholder() {

      if (
        cameraPlaceholder
      ) {

        cameraPlaceholder.classList.add(
          "hidden"
        );

      }

    }


    function showCameraPlaceholder() {

      if (
        cameraPlaceholder
      ) {

        cameraPlaceholder.classList.remove(
          "hidden"
        );

      }

    }


    /* =========================================================
       START CAMERA
       ========================================================= */

    async function startScanner() {

      processing = false;

      showCameraPlaceholder();

      setScannerStatus(
        "Mencari kamera..."
      );

      /*
       * Pastikan library tersedia.
       */

      if (
        typeof Html5Qrcode === "undefined"
      ) {

        console.error(
          "Html5Qrcode library tidak tersedia."
        );

        showServerError({
          message:
            "Library scanner QR tidak berhasil dimuat."
        });

        return;

      }

      /*
       * Hentikan scanner lama jika ada.
       */

      if (scanner) {

        try {

          await scanner.stop();

        } catch (error) {

          console.warn(
            "Scanner stop:",
            error
          );

        }

        try {

          await scanner.clear();

        } catch (error) {

          console.warn(
            "Scanner clear:",
            error
          );

        }

        scanner =
          null;

      }

      /*
       * Bersihkan reader.
       */

      reader.innerHTML = "";

      /*
       * Buat kembali placeholder.
       */

      const placeholder =
        document.createElement(
          "div"
        );

      placeholder.id =
        "cameraPlaceholder";

      placeholder.className =
        "camera-placeholder";

      placeholder.innerHTML = `
        <div class="camera-icon">
          📷
        </div>

        <div class="camera-placeholder-title">
          MEMULAI KAMERA
        </div>

        <div class="camera-placeholder-text">
          Izinkan akses kamera ketika browser memintanya.
        </div>
      `;

      reader.appendChild(
        placeholder
      );


      /* =======================================================
         CREATE SCANNER
         ======================================================= */

      scanner =
        new Html5Qrcode(
          "reader",
          {
            verbose: false
          }
        );


      /* =======================================================
         GET CAMERAS
         ======================================================= */

      let cameras = [];

      try {

        cameras =
          await Html5Qrcode.getCameras();

      } catch (error) {

        console.error(
          "GET CAMERAS ERROR:",
          error
        );

        showCameraPlaceholder();

        setScannerStatus(
          "Browser tidak memberikan akses kamera."
        );

        showServerError({
          message:
            "Kamera tidak dapat diakses. Pastikan izin kamera browser sudah diberikan."
        });

        return;

      }


      if (
        !cameras ||
        cameras.length === 0
      ) {

        showCameraPlaceholder();

        setScannerStatus(
          "Tidak ada kamera yang ditemukan."
        );

        showServerError({
          message:
            "Tidak ada kamera yang tersedia pada perangkat ini."
        });

        return;

      }


      /* =======================================================
         SELECT CAMERA
         ======================================================= */

      let selectedCamera =
        cameras[0];

      const backCamera =
        cameras.find(
          function(camera) {

            const label =
              String(
                camera.label || ""
              ).toLowerCase();

            return (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment")
            );

          }
        );

      if (
        backCamera
      ) {

        selectedCamera =
          backCamera;

      }


      console.log(
        "CAMERAS:",
        cameras
      );

      console.log(
        "SELECTED CAMERA:",
        selectedCamera
      );


      /* =======================================================
         START CAMERA
         ======================================================= */

      try {

        setScannerStatus(
          "Mengaktifkan kamera..."
        );

        await scanner.start(
          selectedCamera.id,

          {
            fps: 10,

            qrbox: function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const minDimension =
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                );

              const size =
                Math.floor(
                  Math.min(
                    minDimension * 0.72,
                    280
                  )
                );

              return {
                width: size,
                height: size
              };

            },

            aspectRatio:
              1.0,

            disableFlip:
              false

          },

          onScanSuccess,

          onScanError

        );

        hideCameraPlaceholder();

        setScannerStatus(
          "Kamera aktif. Arahkan kamera ke QR code."
        );

        console.log(
          "CAMERA STARTED SUCCESSFULLY"
        );

      } catch (error) {

        console.error(
          "CAMERA START ERROR:",
          error
        );

        showCameraPlaceholder();

        setScannerStatus(
          "Kamera gagal diaktifkan."
        );

        showServerError({
          message:
            "Kamera gagal diaktifkan. Pastikan izin kamera browser diberikan dan halaman dibuka melalui HTTPS."
        });

      }

    }


    /* =========================================================
       QR SUCCESS
       ========================================================= */

    function onScanSuccess(
      decodedText
    ) {

      if (
        processing
      ) {

        return;

      }

      const token =
        String(
          decodedText || ""
        ).trim();

      if (
        !token
      ) {

        return;

      }

      processing =
        true;

      stopScanner();

      processToken(
        token
      );

    }


    /* =========================================================
       QR SCAN ERROR
       ========================================================= */

    function onScanError(
      errorMessage
    ) {

      /*
       * Error scan biasa sengaja
       * tidak ditampilkan.
       */

    }


    /* =========================================================
       STOP SCANNER
       ========================================================= */

    async function stopScanner() {

      if (
        !scanner
      ) {

        return;

      }

      try {

        await scanner.stop();

      } catch (error) {

        console.warn(
          "Scanner stop:",
          error
        );

      }

      try {

        await scanner.clear();

      } catch (error) {

        console.warn(
          "Scanner clear:",
          error
        );

      }

      scanner =
        null;

    }


    /* =========================================================
       PROCESS TOKEN
       ========================================================= */

    async function processToken(
      token
    ) {

      showLoading();

      setScannerStatus(
        "Menghubungi server Supabase..."
      );

      const cleanToken =
        String(
          token || ""
        ).trim();

      if (
        !cleanToken
      ) {

        showServerError({
          message:
            "QR token kosong."
        });

        processing =
          false;

        return;

      }


      const requestUrl =
        API_URL +
        "?action=checkIn&token=" +
        encodeURIComponent(
          cleanToken
        );


      if (
        requestTimeout
      ) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }


      let finished =
        false;


      requestTimeout =
        setTimeout(
          function() {

            if (
              finished
            ) {

              return;

            }

            finished =
              true;

            requestTimeout =
              null;

            showServerError({
              message:
                "Server check-in tidak memberikan respons dalam 15 detik."
            });

          },
          15000
        );


      try {

        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",

              cache: "no-store",

              headers:
                await getScannerAuthHeaders()
            }
          );


        if (
          finished
        ) {

          return;

        }

        finished =
          true;


        if (
          requestTimeout
        ) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }


        const rawResponse =
          await response.text();

        let data =
          null;


        try {

          data =
            JSON.parse(
              rawResponse
            );

        } catch (error) {

          console.error(
            "JSON PARSE ERROR:",
            error,
            rawResponse
          );

          showServerError({
            message:
              "Server mengembalikan response JSON yang tidak valid."
          });

          return;

        }


        showResult(
          data
        );


      } catch (error) {

        if (
          finished
        ) {

          return;

        }

        finished =
          true;


        if (
          requestTimeout
        ) {

          clearTimeout(
            requestTimeout
          );

          requestTimeout =
            null;

        }


        console.error(
          "CHECK-IN REQUEST ERROR:",
          error
        );


        showServerError({
          message:
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
        });

      }

    }


    /* =========================================================
       MANUAL CHECK-IN
       ========================================================= */

    function manualCheckIn() {

      if (
        processing
      ) {

        return;

      }


      const token =
        manualToken.value.trim();


      if (
        !token
      ) {

        showTemporaryError(
          "QR TOKEN KOSONG"
        );

        manualToken.focus();

        return;

      }


      processing =
        true;

      stopScanner();

      processToken(
        token
      );

    }


    /* =========================================================
       PURCHASE HELPERS
       ========================================================= */

    function formatCurrency(
      value
    ) {

      const number =
        Number(value || 0);

      return new Intl.NumberFormat(
        "id-ID",
        {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }
      ).format(number);

    }


    function formatDateTime(
      value
    ) {

      if (!value) {
        return "-";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return String(value);
      }

      return new Intl.DateTimeFormat(
        "id-ID",
        {
          dateStyle: "medium",
          timeStyle: "short",
          timeZone: "Asia/Jakarta"
        }
      ).format(date);

    }


    function getPaymentClass(
      status
    ) {

      const normalized =
        String(
          status || ""
        ).toUpperCase();

      if (
        normalized === "APPROVED"
      ) {
        return "payment-approved";
      }

      if (
        normalized === "REJECTED"
      ) {
        return "payment-rejected";
      }

      return "payment-pending";

    }


    function buildPurchaseHtml(
      purchase
    ) {

      if (!purchase) {

        return `
          <div class="no-purchase">
            TIDAK ADA PEMBELIAN TAMBAHAN
          </div>
        `;

      }

      const paymentStatus =
        String(
          purchase.paymentStatus || "-"
        ).toUpperCase();

      const itemDelivered =
        purchase.itemDelivered === true;

      let deliveryHtml =
        "";

      if (
        paymentStatus === "APPROVED" &&
        itemDelivered
      ) {

        deliveryHtml = `
          <div class="delivery-badge delivery-done">
            ✓ BARANG SUDAH DIBERIKAN
          </div>

          <div class="detail">
            <strong>WAKTU PENYERAHAN</strong><br>
            ${escapeHtml(
              formatDateTime(
                purchase.itemDeliveredAt
              )
            )}
          </div>

          <div class="delivery-warning">
            JANGAN BERIKAN BARANG LAGI
          </div>
        `;

      } else if (
        paymentStatus === "APPROVED"
      ) {

        deliveryHtml = `
          <div class="delivery-badge delivery-ready">
            BARANG SIAP DISERAHKAN
          </div>

          <button
            type="button"
            class="deliver-button"
            id="deliverItemButton"
          >
            ✓ SERAHKAN ${escapeHtml(
              purchase.quantity
            )} ${escapeHtml(
              purchase.unitName || "UNIT"
            )}
          </button>
        `;

      } else if (
        paymentStatus === "REJECTED"
      ) {

        deliveryHtml = `
          <div class="delivery-badge delivery-blocked">
            ✕ JANGAN SERAHKAN BARANG
          </div>

          <div class="delivery-warning">
            PEMBAYARAN DITOLAK
          </div>
        `;

      } else {

        deliveryHtml = `
          <div class="delivery-badge delivery-blocked">
            ⚠ JANGAN SERAHKAN BARANG
          </div>

          <div class="delivery-warning">
            PEMBAYARAN BELUM APPROVED
          </div>
        `;

      }

      return `
        <div class="purchase-panel">

          <div class="purchase-heading">
            BARANG PEMBELIAN
          </div>

          <div class="purchase-product">
            ${escapeHtml(
              purchase.productName || "-"
            )}
          </div>

          <div class="purchase-qty">
            ${escapeHtml(
              purchase.quantity
            )}
            ${escapeHtml(
              purchase.unitName || "unit"
            )}
          </div>

          <div class="purchase-grid">

            <div class="purchase-field">
              <div class="purchase-field-label">
                PURCHASE ID
              </div>
              <div class="purchase-field-value">
                ${escapeHtml(
                  purchase.purchaseId || "-"
                )}
              </div>
            </div>

            <div class="purchase-field">
              <div class="purchase-field-label">
                TOTAL
              </div>
              <div class="purchase-field-value">
                ${escapeHtml(
                  formatCurrency(
                    purchase.totalAmount
                  )
                )}
              </div>
            </div>

          </div>

          <div class="payment-badge ${getPaymentClass(
            paymentStatus
          )}">
            PAYMENT ${escapeHtml(
              paymentStatus
            )}
          </div>

          ${deliveryHtml}

        </div>
      `;

    }


    function bindDeliveryButton() {

      const button =
        document.getElementById(
          "deliverItemButton"
        );

      if (!button) {
        return;
      }

      button.addEventListener(
        "click",
        deliverCurrentItem
      );

    }


    async function deliverCurrentItem() {

      if (
        deliveryProcessing ||
        !currentPurchase ||
        !currentPurchase.purchaseId
      ) {
        return;
      }

      if (
        String(
          currentPurchase.paymentStatus || ""
        ).toUpperCase() !== "APPROVED"
      ) {

        alert(
          "Barang tidak boleh diserahkan karena pembayaran belum APPROVED."
        );

        return;
      }

      if (
        currentPurchase.itemDelivered === true
      ) {

        alert(
          "Barang sudah pernah diserahkan."
        );

        return;
      }

      const confirmed =
        window.confirm(
          "Konfirmasi barang sudah benar-benar diberikan?\n\n" +
          String(
            currentPurchase.productName || "Produk"
          ) +
          "\n" +
          String(
            currentPurchase.quantity || 0
          ) +
          " " +
          String(
            currentPurchase.unitName || "unit"
          )
        );

      if (!confirmed) {
        return;
      }

      const button =
        document.getElementById(
          "deliverItemButton"
        );

      deliveryProcessing =
        true;

      if (button) {
        button.disabled = true;
        button.textContent =
          "MENYIMPAN...";
      }

      try {

        const response =
          await fetch(
            API_URL +
              "?action=deliverItem",
            {
              method: "POST",
              cache: "no-store",
              headers: {
                ...(
                  await getScannerAuthHeaders()
                ),
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  purchaseId:
                    currentPurchase.purchaseId
                })
            }
          );

        const raw =
          await response.text();

        let data =
          null;

        try {

          data =
            JSON.parse(raw);

        } catch {

          throw new Error(
            "Server mengembalikan response penyerahan yang tidak valid."
          );

        }

        if (
          data &&
          data.purchase
        ) {

          currentPurchase =
            data.purchase;

        }

        if (
          data &&
          (
            data.status === "DELIVERED" ||
            data.status === "ALREADY_DELIVERED"
          )
        ) {

          if (
            data.status ===
            "ALREADY_DELIVERED"
          ) {

            alert(
              data.message ||
              "Barang sudah dikonfirmasi oleh petugas lain."
            );

          }

          refreshPurchaseDisplay();

          setScannerStatus(
            data.status === "DELIVERED"
              ? "Barang berhasil dikonfirmasi sudah diserahkan."
              : "Barang sudah pernah diserahkan."
          );

          return;
        }

        throw new Error(
          data &&
          data.message
            ? data.message
            : "Gagal mengonfirmasi penyerahan barang."
        );

      } catch (error) {

        console.error(
          "DELIVER ITEM ERROR:",
          error
        );

        alert(
          error &&
          error.message
            ? error.message
            : "Gagal mengonfirmasi penyerahan barang."
        );

      } finally {

        deliveryProcessing =
          false;

        const latestButton =
          document.getElementById(
            "deliverItemButton"
          );

        if (latestButton) {
          latestButton.disabled =
            false;
        }

      }

    }


    function refreshPurchaseDisplay() {

      const purchaseContainer =
        document.getElementById(
          "purchaseResultContainer"
        );

      if (!purchaseContainer) {
        return;
      }

      purchaseContainer.innerHTML =
        buildPurchaseHtml(
          currentPurchase
        );

      bindDeliveryButton();

    }


    /* =========================================================
       RESULT
       ========================================================= */

    function showResult(
      data
    ) {

      result.className =
        "result";

      result.style.display =
        "block";


      /* =======================================================
         VALID
         ======================================================= */

      if (
        data &&
        data.status === "VALID"
      ) {

        result.classList.add(
          "valid"
        );

        resultTitle.textContent =
          "✓ ENTRY APPROVED";

        currentPurchase =
          data.purchase || null;

        resultDetails.innerHTML =
          `
          <div class="detail">
            <strong>NAMA</strong><br>
            ${escapeHtml(data.name)}
          </div>

          <div class="detail">
            <strong>PASS ID</strong><br>
            ${escapeHtml(data.passId)}
          </div>

          <div class="detail">
            <strong>ACCESS</strong><br>
            ${escapeHtml(data.accessType)}
          </div>

          <div class="detail">
            <strong>CHECK-IN</strong><br>
            ${escapeHtml(
              formatDateTime(
                data.checkInTime
              )
            )}
          </div>

          <div id="purchaseResultContainer">
            ${buildPurchaseHtml(
              currentPurchase
            )}
          </div>
          `;

        bindDeliveryButton();

        setScannerStatus(
          "Check-in berhasil."
        );

        return;

      }


      /* =======================================================
         ALREADY USED
         ======================================================= */

      if (
        data &&
        (
          data.status === "ALREADY_USED" ||
          data.status === "USED"
        )
      ) {

        result.classList.add(
          "used"
        );

        resultTitle.textContent =
          "⚠ ALREADY USED";

        currentPurchase =
          data.purchase || null;

        resultDetails.innerHTML =
          `
          <div class="detail">
            <strong>QR INI SUDAH DIGUNAKAN</strong>
          </div>

          <div class="detail">
            <strong>NAMA</strong><br>
            ${escapeHtml(data.name)}
          </div>

          <div class="detail">
            <strong>PASS ID</strong><br>
            ${escapeHtml(data.passId)}
          </div>

          <div class="detail">
            <strong>ACCESS</strong><br>
            ${escapeHtml(data.accessType)}
          </div>

          <div class="detail">
            <strong>CHECK-IN PERTAMA</strong><br>
            ${escapeHtml(
              formatDateTime(
                data.checkInTime
              )
            )}
          </div>

          <div id="purchaseResultContainer">
            ${buildPurchaseHtml(
              currentPurchase
            )}
          </div>
          `;

        bindDeliveryButton();

        setScannerStatus(
          currentPurchase &&
          currentPurchase.itemDelivered === true
            ? "QR sudah digunakan dan barang sudah pernah diserahkan."
            : "QR sudah pernah digunakan."
        );

        return;

      }


      /* =======================================================
         INVALID
         ======================================================= */

      if (
        data &&
        (
          data.status === "INVALID" ||
          data.status === "NOT_FOUND"
        )
      ) {

        currentPurchase =
          null;

        result.classList.add(
          "invalid"
        );

        resultTitle.textContent =
          "✕ INVALID QR";

        resultDetails.innerHTML =
          `
          <div class="detail">
            ${escapeHtml(
              data.message ||
              "QR tidak terdaftar."
            )}
          </div>
          `;

        setScannerStatus(
          "QR tidak valid."
        );

        return;

      }


      /* =======================================================
         SERVER ERROR
         ======================================================= */

      currentPurchase =
        null;

      result.classList.add(
        "error"
      );

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        `
        <div class="detail">
          ${escapeHtml(
            data &&
            data.message
              ? data.message
              : "Terjadi kesalahan pada server check-in."
          )}
        </div>
        `;

      setScannerStatus(
        "Terjadi kesalahan."
      );

    }


    /* =========================================================
       LOADING
       ========================================================= */

    function showLoading() {

      currentPurchase =
        null;

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "CHECKING...";

      resultDetails.innerHTML =
        `
        <div class="detail">
          Memverifikasi QR ke Supabase...
        </div>
        `;

    }


    /* =========================================================
       SERVER ERROR
       ========================================================= */

    function showServerError(
      error
    ) {

      currentPurchase =
        null;

      result.className =
        "result error";

      result.style.display =
        "block";

      resultTitle.textContent =
        "SYSTEM ERROR";

      resultDetails.innerHTML =
        `
        <div class="detail">
          ${escapeHtml(
            error &&
            error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
          )}
        </div>
        `;

      setScannerStatus(
        "Terjadi kesalahan."
      );

    }


    /* =========================================================
       TEMPORARY ERROR
       ========================================================= */

    function showTemporaryError(
      message
    ) {

      currentPurchase =
        null;

      result.className =
        "result invalid";

      result.style.display =
        "block";

      resultTitle.textContent =
        "✕ INVALID";

      resultDetails.innerHTML =
        `
        <div class="detail">
          ${escapeHtml(message)}
        </div>
        `;

      setScannerStatus(
        "Input tidak valid."
      );

    }


    /* =========================================================
       RESET
       ========================================================= */

    async function resetScanner() {

      if (
        requestTimeout
      ) {

        clearTimeout(
          requestTimeout
        );

        requestTimeout =
          null;

      }


      result.style.display =
        "none";

      result.className =
        "result";

      resultTitle.textContent =
        "";

      resultDetails.innerHTML =
        "";

      manualToken.value =
        "";

      currentPurchase =
        null;

      deliveryProcessing =
        false;

      processing =
        false;


      await startScanner();

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       EVENTS
       ========================================================= */

    manualButton.addEventListener(
      "click",
      manualCheckIn
    );


    resetButton.addEventListener(
      "click",
      resetScanner
    );


    manualToken.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          manualCheckIn();

        }

      }
    );


    /* =========================================================
       PAGE INITIALIZATION
       =========================================================

       PENTING:

       Navigation dimuat terlebih dahulu,
       tetapi kegagalannya TIDAK menghentikan kamera.

       ========================================================= */

    window.addEventListener(
      "DOMContentLoaded",
      async function() {

        console.log(
          "BOLD AFTER DARK SCANNER INITIALIZING..."
        );


        /*
         * Navigation tidak boleh
         * menghentikan scanner.
         */

        loadNavigationConfig();


        /*
         * Scanner hanya boleh aktif
         * setelah permission scanner.use
         * tervalidasi.
         */

        const allowed =
          await requireScannerAccess();

        if (!allowed) {

          return;

        }


        await startScanner();

      }
    );


    /* =========================================================
       DEBUG
       ========================================================= */

    window.addEventListener(
      "error",
      function(event) {

        console.error(
          "PAGE ERROR:",
          event.error || event.message
        );

      }
    );

  </script>

</body>
</html>
